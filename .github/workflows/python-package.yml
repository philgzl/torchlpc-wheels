# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-ubuntu:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
    - name: Install torch
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install setuptools wheel
        pip install --no-build-isolation -e .[dev]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  build-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install libomp
      run: |
        brew install libomp llvm
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Build CPP extension with clang++
      run: |
        pip install torch setuptools wheel
        export CXX=$(brew --prefix llvm)/bin/clang++
        # Link against the libomp bundled with torch, not Homebrew's: two
        # OpenMP runtimes in one process abort at import (OMP Error #15).
        TORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
        ls "$TORCH_LIB" | grep -i omp
        export LDFLAGS="-L$TORCH_LIB -Wl,-rpath,$TORCH_LIB"
        export CPPFLAGS="-I/opt/homebrew/opt/libomp/include"
        set -o pipefail
        pip install -v --no-build-isolation -e .[dev] 2>&1 | tee build.log || {
          grep -iE "error|fatal" build.log | grep -vE "Werror|-Wno-" | head -n 15 \
            | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
    - name: Test with pytest
      run: |
        otool -L torchlpc/_C*.so | grep -i omp || true
        pytest
