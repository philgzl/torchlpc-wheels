[build-system]
requires = [
    "setuptools >= 77.0.3",
    "wheel",
    "torch",
]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.package-data]
torchlpc = ["VERSION.txt"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]

[tool.setuptools]
# this package will read some included files in runtime, avoid installing it as .zip
zip-safe = false
license-files = ["LICENSE"]

[project]
# version and dependencies (incl. the torch pin) are set per build in setup.py
dynamic = ["version", "dependencies"]
# the import name stays `torchlpc`
name = "torchlpc-wheels"
requires-python = ">=3.9"
authors = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
maintainers = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
description = "Fast, efficient, and differentiable time-varying LPC filtering in PyTorch."
readme = "README.md"
license = { text = "MIT" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/philgzl/torchlpc-wheels"
Upstream = "https://github.com/DiffAPF/torchlpc"

[project.optional-dependencies]
dev = ["pytest >= 6.0", "scipy", "numpy", "pytest-cov"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--cov=torchlpc",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
